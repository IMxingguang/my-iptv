name: update hunan source

on:
  schedule:
    - cron: '40 22 * * *'    # 北京时间每日 06:40
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 拉取并验证湖南移动直播源
        env:
          OUT_FILE: hunan.m3u
        run: python hunan_update.py --no-test

      - name: 提交结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update hunan.m3u [skip ci]'
          file_pattern: hunan.m3u
