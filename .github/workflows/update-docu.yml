name: update documentary source

on:
  schedule:
    - cron: '20 22 * * *'    # 北京时间每日 06:20
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 拉取最新纪录片列表
        run: curl -sL --max-time 60 "https://iptv-org.github.io/iptv/categories/documentary.m3u" -o docu_raw.m3u

      - name: 测速分拣
        run: python docu_test.py docu_raw.m3u docu_live.m3u 12

      - name: 提交结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update docu_live.m3u [skip ci]'
          file_pattern: docu_live.m3u
